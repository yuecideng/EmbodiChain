environment_id: pick_place
max_episodes: 150
max_episode_steps: 600
num_envs: 8
arena_space: 2.5
simulation:
  light:
    direct:
    - uid: main_light
      light_type: point
      color:
      - 1.0
      - 1.0
      - 1.0
      intensity: 60.0
      init_pos:
      - 1.0
      - -0.5
      - 2.5
      radius: 10.0
  background:
  - uid: goal_marker
    shape:
      shape_type: Cube
      size:
      - 0.12
      - 0.12
      - 0.01
      visual_material:
        base_color: [0.05, 0.8, 0.1, 1.0]
    body_type: kinematic
    init_pos:
    - -0.4
    - 0.48
    - 0.005
    attrs:
      mass: 0.01
  rigid_object:
  - uid: cube
    shape:
      shape_type: Cube
      size:
      - 0.05
      - 0.05
      - 0.05
    body_type: dynamic
    init_pos:
    - -0.42
    - -0.08
    - 0.025
    attrs:
      mass: 0.05
      dynamic_friction: 0.8
      static_friction: 0.9
      restitution: 0.0
  rigid_object_group: []
  articulation: []
env:
  sim_steps_per_control: 4
  events:
    randomize_cube:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: cube
        position_range:
        - - -0.52
          - -0.18
          - 0.025
        - - -0.32
          - 0.02
          - 0.025
        rotation_range:
        - - 0
          - 0
          - -15.0
        - - 0
          - 0
          - 15.0
        relative_position: false
    randomize_goal:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: goal_marker
        position_range:
        - - -0.48
          - 0.38
          - 0.005
        - - -0.32
          - 0.58
          - 0.005
        rotation_range:
        - - 0
          - 0
          - -15.0
        - - 0
          - 0
          - 15.0
        relative_position: false
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      save_failed_episodes: true
      params:
        save_path: /path/to/datasets/embodichain/pick_place/test_ood
        robot_meta:
          robot_type: FrankaPanda
        instruction:
          lang: Pick up the cube and place it on the marked target.
        extra:
          scene_type: tabletop
          task_description: pick_and_place
          data_type: sim
          spatial_profile: ood
        use_videos: true
  extensions:
    deterministic_grasp: true
    deterministic_grasp_seed: 0
    deterministic_grasp_variant: original
    spatial_grid_size: 5
    spatial_cube_x_range:
    - -0.52
    - -0.32
    spatial_cube_y_range:
    - -0.18
    - 0.02
    spatial_goal_x_range:
    - -0.48
    - -0.32
    spatial_goal_y_range:
    - 0.38
    - 0.58
